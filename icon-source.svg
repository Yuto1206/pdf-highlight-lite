<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d3d7a"/>
      <stop offset="100%" stop-color="#1a6fdb"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- ノート -->
  <rect x="150" y="110" width="212" height="290" rx="16" fill="none" stroke="#0b1f3a" stroke-width="16"/>

  <!-- 通常の行 -->
  <line x1="182" y1="170" x2="330" y2="170" stroke="#0b1f3a" stroke-width="10" stroke-linecap="round"/>

  <!-- ハイライトされた行 -->
  <rect x="176" y="205" width="160" height="28" rx="5" fill="#ffd23f"/>
  <line x1="182" y1="219" x2="330" y2="219" stroke="#0b1f3a" stroke-width="10" stroke-linecap="round"/>

  <line x1="182" y1="268" x2="300" y2="268" stroke="#0b1f3a" stroke-width="10" stroke-linecap="round"/>
  <line x1="182" y1="316" x2="330" y2="316" stroke="#0b1f3a" stroke-width="10" stroke-linecap="round"/>
  <line x1="182" y1="364" x2="280" y2="364" stroke="#0b1f3a" stroke-width="10" stroke-linecap="round"/>

  <!-- 蛍光ペン（斜め、先端がハイライト行に触れる） -->
  <g transform="translate(322,168) rotate(35)">
    <rect x="0" y="0" width="32" height="120" rx="6" fill="#0b1f3a"/>
    <polygon points="0,120 32,120 16,140" fill="#0b1f3a"/>
    <rect x="4" y="0" width="24" height="28" rx="4" fill="#ffd23f"/>
  </g>

  <!-- 再生ボタンのバッジ（映像授業由来を示す） -->
  <circle cx="366" cy="118" r="36" fill="#0b1f3a"/>
  <polygon points="355,101 355,135 384,118" fill="#ffffff"/>
</svg>
